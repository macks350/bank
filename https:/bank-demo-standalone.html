<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Bank Demo (standalone)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display:flex; gap:8px; margin:8px 0; }
    .small { font-size:12px; color:#555; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; }
  </style>
</head>
<body>
  <h1>Bank Demo</h1>
  <p class="small">Учебный проект. Не реальный банк.</p>

  <div>Баланс: <b id="bal">0</b> ₽</div>
  <div class="row">
    <input id="amount" type="number" placeholder="Сумма" />
    <button id="addBtn">Пополнить</button>
    <button id="subBtn">Списать</button>
  </div>

  <h3>История операций</h3>
  <table id="histTable"><thead><tr><th>Тип</th><th>Сумма</th><th>Время</th><th>Комментарий</th></tr></thead><tbody></tbody></table>

  <script>
    // Изолированное хранилище для Bank Demo
    const BANK_KEY_BAL = 'bank_demo_balance_v1';
    const BANK_KEY_HIST = 'bank_demo_history_v1';
    const START = 125000;

    function initBank(){
      if(localStorage.getItem(BANK_KEY_BAL) === null){
        localStorage.setItem(BANK_KEY_BAL, String(START));
        pushHist({type:'init', sum:START, ts:new Date().toISOString(), note:'Стартовый баланс'});
      }
    }
    function getBal(){ return Number(localStorage.getItem(BANK_KEY_BAL) || START); }
    function setBal(v){ localStorage.setItem(BANK_KEY_BAL, String(v)); renderBal(); }
    function pushHist(e){
      const h = JSON.parse(localStorage.getItem(BANK_KEY_HIST) || '[]');
      h.push(e); localStorage.setItem(BANK_KEY_HIST, JSON.stringify(h));
    }
    function renderBal(){ document.getElementById('bal').textContent = getBal(); }
    function renderHist(){
      const hist = JSON.parse(localStorage.getItem(BANK_KEY_HIST) || '[]');
      document.querySelector('#histTable tbody').innerHTML = hist.slice().reverse().map(r=>`
        <tr><td>${r.type}</td><td>${r.sum}</td><td>${r.ts}</td><td>${r.note||''}</td></tr>
      `).join('');
    }

    document.getElementById('addBtn').onclick = ()=>{
      const v = Number(document.getElementById('amount').value||0);
      if(v<=0){ alert('Введите положительную сумму'); return; }
      setBal(getBal()+v);
      pushHist({type:'topup', sum:v, ts:new Date().toISOString(), note:'Пополнение'});
    };
    document.getElementById('subBtn').onclick = ()=>{
      const v = Number(document.getElementById('amount').value||0);
      if(v<=0){ alert('Введите положительную сумму'); return; }
      if(getBal()<v){ alert('Недостаточно средств'); return; }
      setBal(getBal()-v);
      pushHist({type:'withdraw', sum:-v, ts:new Date().toISOString(), note:'Списание'});
    };

    initBank();
    renderBal();
    renderHist();
  </script>
</body>
</html>
